[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-review-github"
version = "0.4.0"
description = "Seven PR review agents, with GitHub Issues and GitHub Actions"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.11,<3"]

[project.optional-dependencies]
# Needed only for the laboratory checks run on your own computer (verify.sh).
lab = ["pytest>=8,<10", "pytest-cov>=6,<8"]

[project.scripts]
ai-review = "review.cli:main"

[tool.setuptools.packages.find]
include = ["review*"]
