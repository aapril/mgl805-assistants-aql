<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" font-family="Liberation Sans Narrow, Arial Narrow, sans-serif" font-size="21">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs>
<rect width="900" height="760" fill="#fff"/>
<!-- inputs -->
<rect x="40" y="20" width="370" height="70" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="225" y="48" text-anchor="middle" font-weight="bold">Pull request (the builder’s work)</text>
<text x="225" y="72" text-anchor="middle">Commits, diff, “Closes #n”</text>
<rect x="490" y="20" width="370" height="70" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="675" y="48" text-anchor="middle" font-weight="bold">GitHub issue</text>
<text x="675" y="72" text-anchor="middle">Requirement and acceptance criteria</text>
<!-- zone A -->
<rect x="20" y="120" width="410" height="330" fill="#f2f2f2" stroke="#000" stroke-width="1.5" stroke-dasharray="8,5"/>
<text x="35" y="145" font-size="19" font-style="normal" font-weight="bold">ZONE 1: UNTRUSTED CODE</text>
<text x="35" y="166" font-size="18">Read-only token, no secrets</text>
<rect x="45" y="180" width="360" height="160" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="225" y="206" text-anchor="middle" font-weight="bold">PR Evidence Checks</text>
<text x="225" y="228" text-anchor="middle" font-size="19">on pull_request</text>
<text x="225" y="256" text-anchor="middle" font-size="19">Disposable container: no network,</text>
<text x="225" y="276" text-anchor="middle" font-size="19">read-only, no capabilities</text>
<text x="225" y="306" text-anchor="middle" font-size="19">Ruff · Bandit · Gitleaks · pytest</text>
<text x="225" y="326" text-anchor="middle" font-size="19">and coverage</text>
<rect x="85" y="360" width="280" height="44" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="225" y="388" text-anchor="middle" font-size="19">evidence.json, bound to the SHA</text>
<line x1="225" y1="340" x2="225" y2="358" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
<!-- zone B -->
<rect x="470" y="120" width="410" height="440" fill="#f2f2f2" stroke="#000" stroke-width="1.5" stroke-dasharray="8,5"/>
<text x="485" y="145" font-size="19" font-weight="bold">ZONE 2: TRUSTED REVIEWER</text><text x="485" y="166" font-size="18">Trusted code only; may comment</text>
<text x="590" y="145" font-size="18"></text><text x="485" y="166" font-size="18"></text>
<rect x="495" y="180" width="360" height="54" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="675" y="203" text-anchor="middle" font-weight="bold">AI Code Review</text>
<text x="675" y="224" text-anchor="middle" font-size="19">on workflow_run; never runs PR code</text>
<rect x="495" y="248" width="360" height="40" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="675" y="274" text-anchor="middle" font-size="19">1. Verify schema and commit of evidence</text>
<rect x="495" y="300" width="360" height="40" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="675" y="326" text-anchor="middle" font-size="19">2. Ollama with qwen2.5-coder:7b</text>
<!-- agents -->
<g font-size="18" text-anchor="middle">
<rect x="495" y="352" width="114" height="34" fill="#fff" stroke="#000"/><text x="552" y="374">1 Requirements</text>
<rect x="618" y="352" width="114" height="34" fill="#fff" stroke="#000"/><text x="675" y="374">2 Code</text>
<rect x="741" y="352" width="114" height="34" fill="#fff" stroke="#000"/><text x="798" y="374">3 Quality</text>
<rect x="495" y="394" width="114" height="34" fill="#fff" stroke="#000"/><text x="552" y="416">4 Compliance</text>
<rect x="618" y="394" width="114" height="34" fill="#fff" stroke="#000"/><text x="675" y="416">5 Tests</text>
<rect x="741" y="394" width="114" height="34" fill="#fff" stroke="#000"/><text x="798" y="416">6 Security</text>
<rect x="495" y="436" width="360" height="34" fill="#fff" stroke="#000"/><text x="675" y="458">7 Synthesis (text only, no findings)</text>
</g>
<rect x="495" y="482" width="360" height="62" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="675" y="507" text-anchor="middle" font-size="19" font-weight="bold">3. Deterministic decision rule</text>
<text x="675" y="530" text-anchor="middle" font-size="19">Recommendation computed by the program</text>
<!-- arrows from inputs -->
<line x1="380" y1="90" x2="380" y2="178" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M300,90 L300,106 L770,106 L770,178" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
<text x="310" y="102" font-size="16">diff</text>
<line x1="835" y1="90" x2="835" y2="178" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M365,382 L450,382 L450,268 L493,268" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
<text x="45" y="432" font-size="18">The artifact is treated as untrusted data by Zone 2</text>
<!-- output -->
<rect x="470" y="585" width="410" height="54" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="675" y="608" text-anchor="middle" font-size="19">Single summary comment on the PR;</text>
<text x="675" y="628" text-anchor="middle" font-size="19">JSON and Markdown reports kept 14 days</text>
<line x1="675" y1="544" x2="675" y2="583" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
<!-- human -->
<rect x="40" y="670" width="820" height="70" fill="#d9d9d9" stroke="#000" stroke-width="3"/>
<text x="450" y="698" text-anchor="middle" font-weight="bold">Human reviewer: the only one who decides</text>
<text x="450" y="722" text-anchor="middle" font-size="19">Reads and verifies the findings, accepts or rejects each one, approves and merges manually</text>
<line x1="675" y1="639" x2="675" y2="668" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
<!-- unit tests -->
<rect x="20" y="480" width="410" height="80" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="225" y="508" text-anchor="middle" font-weight="bold">Reviewer Unit Tests</text>
<text x="225" y="530" text-anchor="middle" font-size="19">on push and pull_request: 53 tests of the</text>
<text x="225" y="549" text-anchor="middle" font-size="19">assistant itself, plus a simulated run</text>
</svg>
