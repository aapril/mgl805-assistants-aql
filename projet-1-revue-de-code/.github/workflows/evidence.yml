name: PR Evidence Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

# The evidence job has no write token or access to Ollama.
permissions:
  contents: read

concurrency:
  group: evidence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  collect-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      COVERAGE_SOURCE: ${{ vars.REVIEW_COVERAGE_SOURCE || 'example_app' }}
      SCAN_PATH: ${{ vars.REVIEW_SCAN_PATH || 'example_app' }}
    steps:
      - name: Read the approved collector from the target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - name: Read the exact commit of the pull request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: target
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare the approved tools
        run: |
          python -m pip install ./trusted
          docker build -f trusted/Dockerfile.runner -t ai-review-runner:local trusted
      - name: Run the analyzers in the disposable container
        run: |
          test "$(git -C target rev-parse HEAD)" = "$PR_HEAD_SHA"
          mkdir -p runner-output
          # Container drops DAC override; allow it to write the dedicated output volume.
          chmod 0777 runner-output
          docker run --rm --network=none --read-only \
            --cap-drop=ALL --security-opt=no-new-privileges \
            --pids-limit=256 --memory=4g --cpus=2 \
            --tmpfs /tmp:rw,nosuid,size=2g \
            --mount "type=bind,src=$PWD/target,dst=/source,readonly" \
            --mount "type=bind,src=$PWD/runner-output,dst=/out" \
            --env "COVERAGE_SOURCE=$COVERAGE_SOURCE" \
            --env "SCAN_PATH=$SCAN_PATH" \
            ai-review-runner:local sh -c \
            'cp -R /source /tmp/repo && python scripts/collect_evidence.py --repo /tmp/repo --out /out/evidence.json --run-tests --coverage-source "$COVERAGE_SOURCE" --scan-path "$SCAN_PATH"'
      - name: Validate the format and commit of the evidence
        run: |
          python -m review.ci normalize --input runner-output/evidence.json \
            --head "$PR_HEAD_SHA" --output artifacts/evidence.json
      - name: Keep the evidence for the seven agents
        uses: actions/upload-artifact@v4
        with:
          name: review-evidence-${{ github.event.pull_request.head.sha }}
          path: artifacts/evidence.json
          if-no-files-found: error
          retention-days: 7
      - name: Apply the gate criteria
        run: |
          python -m review.ci gate --input artifacts/evidence.json --head "$PR_HEAD_SHA"
